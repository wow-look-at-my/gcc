name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      reset_cache:
        description: 'Clear the persisted compile cache before building (forces a cold run)'
        type: boolean
        required: false
        default: false
      build_pgo:
        description: 'Also run the package-pgo job (PGO-built release package)'
        type: boolean
        required: false
        default: false
      build_baseline:
        description: 'Rebuild vanilla GCC at the fork point and (re)publish the testsuite baseline .sums to buildhost (multi-hour)'
        type: boolean
        required: false
        default: false
      run_testsuite:
        description: 'Run the GCC testsuite gate against the published baseline (multi-hour)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write
  # Mint short-lived GHA OIDC tokens: the "Publish to buildhost" steps in
  # `build` and `package-pgo` authenticate to pazer.build with one instead
  # of a static secret (the project auto-provisions server-side).
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Persisted compile-cache directory, shared across runs via actions/cache.
  GCC_CC_DIR: ${{ github.workspace }}/.gcc-compile-cache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install build dependencies
        # libgoogle-perftools-dev ships libtcmalloc_minimal.a, which
        # cc1/cc1plus link statically when present (gcc/cp/Make-lang.in
        # TCMALLOC_LIBS); the build degrades gracefully without it.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libgmp-dev libmpfr-dev libmpc-dev libisl-dev libgoogle-perftools-dev

      # This branch's cc1plus links the embedded GNU assembler (libgas.a) for
      # -fintegrated-as, so the build needs a "combined tree": binutils 2.42's
      # gas/bfd/opcodes/libsframe/libctf built alongside GCC. The driver-level
      # .o cache itself works without the integrated assembler, but cc1plus does
      # not link unless libgas.a (built from this combined tree by
      # contrib/gas-embed/build-libgas.sh) is present. The recipe below mirrors
      # contrib/gas-embed/README.md exactly. binutils setup is plain shell (no
      # third-party actions): download the upstream tarball, symlink the modules
      # and binutils-only headers into the GCC checkout, apply the gas patch.
      - name: Fetch binutils 2.42
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -fL -o binutils.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.42.tar.xz
          tar xf binutils.tar.xz
          test -d binutils-2.42/gas

      # Combined-tree symlinks into the GCC checkout (README "Combined-tree setup
      # recipe", Stage 1). (1) Top-level binutils-only module dirs GCC lacks.
      # (2) The skew fix: every binutils-only header symlinked into GCC's shared
      # include/ (bfd/opcodes/gas include ~30 headers GCC-14's include/ does not
      # ship). We link each entry from binutils' include/ that GCC's pristine
      # include/ does not already provide, skipping the gcc-owned doc files; the
      # overlapping headers (libiberty.h, ansidecl.h, ...) are byte-identical
      # between GCC-14 and binutils 2.42, so GCC's stay authoritative. Do NOT
      # symlink config/ include/ libiberty/ zlib/ -- the tree shares GCC's.
      - name: Set up combined tree (symlinks)
        run: |
          cd "$GITHUB_WORKSPACE"
          BU="$GITHUB_WORKSPACE/binutils-2.42"
          for d in bfd opcodes gas libsframe libctf; do
            ln -sfn "$BU/$d" "$GITHUB_WORKSPACE/$d"
          done
          for entry in "$BU"/include/*; do
            name="$(basename "$entry")"
            case "$name" in
              ChangeLog*|MAINTAINERS|COPYING*) continue ;;
            esac
            if [ ! -e "$GITHUB_WORKSPACE/include/$name" ]; then
              ln -sfn "$entry" "$GITHUB_WORKSPACE/include/$name"
            fi
          done
          echo "binutils-only headers linked into include/:"
          find include/ -maxdepth 1 -lname "$BU/*" -printf '%f ' ; echo

      # Apply the integrated-assembler gas patch to the pristine binutils 2.42
      # gas/ tree. The patch paths are a/<file> relative to gas/, so apply from
      # there with -p1 (README "Applying the binutils gas source changes").
      - name: Apply gas integrated-as patch
        run: |
          cd "$GITHUB_WORKSPACE"
          patch -p1 -d binutils-2.42/gas < contrib/gas-embed/gas-integrated-as.patch
          test -f binutils-2.42/gas/embed.c

      # Configure out-of-tree. Keeps the original CI flags and adds the
      # combined-tree requirements from the proven recipe (README Stage 1):
      # --with-system-zlib (so the tree needs no zlib/ module), --disable-nls,
      # --disable-werror, and MAKEINFO=true (no makeinfo on the runner). The
      # config triplet is deliberately left to GCC's default canonicalization
      # (x86_64-pc-linux-gnu) -- the same as the prior working CI -- so the
      # target-library subdir paths the verify/benchmark scripts expect are
      # unchanged.
      - name: Configure GCC (combined tree, out of tree)
        run: |
          mkdir -p "$RUNNER_TEMP/gccbuild"
          cd "$RUNNER_TEMP/gccbuild"
          "$GITHUB_WORKSPACE/configure" \
            --disable-bootstrap --enable-languages=c,c++ --disable-multilib \
            --with-system-zlib --disable-nls --disable-werror \
            MAKEINFO=true

      # Build the binutils host libraries first, then assemble libgas.a from the
      # combined tree, then build GCC. build-libgas.sh writes ../libgas.a (top of
      # the build tree) which cc1plus/cc1/lto1 link via GAS_LIBS (cp/Make-lang.in).
      # The script's source paths default to the local checkout; point them at
      # this checkout via $GAS_SRC / $GAS_EMBED_DIR.
      - name: Build binutils host libs (bfd, opcodes, gas)
        run: |
          cd "$RUNNER_TEMP/gccbuild"
          make -j"$(nproc)" all-libiberty MAKEINFO=true
          make -j"$(nproc)" all-bfd all-opcodes all-gas MAKEINFO=true

      - name: Build libgas.a
        run: |
          export GAS_SRC="$GITHUB_WORKSPACE/gas"
          export GAS_EMBED_DIR="$GITHUB_WORKSPACE/contrib/gas-embed"
          bash "$GITHUB_WORKSPACE/contrib/gas-embed/build-libgas.sh" "$RUNNER_TEMP/gccbuild"
          test -f "$RUNNER_TEMP/gccbuild/libgas.a"

      # Now build GCC itself: all-gcc links cc1plus/cc1/lto1 against ../libgas.a
      # (present from the previous step). Then build the target libraries the
      # cache verify and benchmark need -- all-target-libstdc++-v3 pulls in its
      # prerequisites (all-gcc, all-target-libgcc, and the build-tree libstdc++
      # headers + libstdc++.so the C++ checks link against). Building these two
      # targets explicitly (rather than a bare `make all`) keeps the build to
      # what the proven recipe and the CI scripts require and skips the unrelated
      # ld/binutils host modules the combined tree would otherwise also build.
      - name: Build GCC
        run: |
          cd "$RUNNER_TEMP/gccbuild"
          make -j"$(nproc)" all-gcc MAKEINFO=true
          make -j"$(nproc)" all-target-libstdc++-v3 MAKEINFO=true

      - name: Verify in-compiler cache
        run: node "$GITHUB_WORKSPACE/.github/scripts/ci-verify-cache.mjs" "$RUNNER_TEMP/gccbuild"

      # Package the whole build dir (cc1/cc1plus/xgcc/xg++ plus the build-tree
      # libstdc++ needed for linking and STL compiles) so the benchmark job can
      # restore the exact compiler without rebuilding. Large but compresses well.
      - name: Package built compiler
        run: |
          tar -C "$RUNNER_TEMP" -czf gccbuild.tar.gz gccbuild
          ls -lh gccbuild.tar.gz

      - name: Upload built compiler
        uses: actions/upload-artifact@v4
        with:
          name: gccbuild
          path: gccbuild.tar.gz
          retention-days: 1

      # Small "installed dist" for the buildhost publish below. The published
      # artifact MUST stay well under ~100 MiB: pazer.build's only ingress is
      # a Cloudflare Tunnel, and Cloudflare's edge caps a request body at
      # ~100 MiB (a bigger single PUT draws an instant 413 at the edge;
      # buildhost has no chunked artifact upload). The ~1 GiB build-tree
      # tarball above therefore cannot be published -- this stripped DESTDIR
      # install (~38 MiB tar.zst, ~193 MiB unpacked) is what goes to the
      # registry. It is relocatable: gcc-dist/bin/{gcc,g++} compile, link and
      # run C/C++ from any extraction path with no -B/-I flags (cc1plus,
      # headers and libstdc++ resolve relative to the driver); the trailing
      # smoke test re-proves that from the packed bits on every run.
      - name: Package installed dist (fits buildhost upload cap)
        run: |
          WORK="$RUNNER_TEMP/dist"
          rm -rf "$WORK"
          make -C "$RUNNER_TEMP/gccbuild" -j2 install-gcc install-target-libgcc install-target-libstdc++-v3 \
            DESTDIR="$WORK" MAKEINFO=true
          # configured --prefix is /usr/local; rename the installed prefix
          mv "$WORK/usr/local" "$WORK/gcc-dist"
          cd "$WORK/gcc-dist"
          # trim what a consumer never needs (keep c++ headers, libgcc, crt, specs)
          rm -rf share/man share/info share/doc
          rm -rf libexec/gcc/x86_64-pc-linux-gnu/*/install-tools lib/gcc/x86_64-pc-linux-gnu/*/install-tools
          find . -name '*.la' -delete
          # strip(1) replaces inodes, which would break the driver hardlink
          # groups (gcc/g++/c++/x86_64-pc-linux-gnu-* share inodes): record
          # the groups, strip one path per inode, then restore the links.
          find . -type f -links +1 -printf '%i %p\n' | sort -n > "$WORK/hardlinks.txt"
          find . -type f -exec file {} + | grep -E 'ELF.*(executable|shared object)' | cut -d: -f1 > "$WORK/elf.txt"
          while read -r f; do printf '%s %s\n' "$(stat -c %i "$f")" "$f"; done < "$WORK/elf.txt" \
            | awk '!seen[$1]++ { $1=""; sub(/^ /,""); print }' > "$WORK/striplist.txt"
          xargs -a "$WORK/striplist.txt" strip --strip-unneeded
          awk '{ if ($1 in first) print first[$1] "\t" $2; else first[$1]=$2 }' "$WORK/hardlinks.txt" \
            | while IFS=$'\t' read -r src dst; do ln -f "$src" "$dst"; done
          # static libs / crt objects: --strip-debug only (--strip-unneeded would gut them)
          find . -type f \( -name '*.a' -o -name 'crt*.o' \) -exec strip --strip-debug {} +
          du -sh "$WORK/gcc-dist"
          tar -C "$WORK" -cf - gcc-dist | zstd -19 --long=27 -T0 -o "$GITHUB_WORKSPACE/gcc-dist.tar.zst"
          ls -l "$GITHUB_WORKSPACE/gcc-dist.tar.zst"
          # smoke test the packed dist from a fresh path before publishing it
          mkdir -p "$RUNNER_TEMP/dist-smoke"
          tar -C "$RUNNER_TEMP/dist-smoke" --zstd -xf "$GITHUB_WORKSPACE/gcc-dist.tar.zst"
          cat > "$RUNNER_TEMP/dist-smoke/t.cpp" <<'EOF'
          #include <vector>
          #include <iostream>
          int main() { std::vector<int> v{1,2,3}; int s=0; for (int x : v) s+=x; std::cout << s << "\n"; }
          EOF
          "$RUNNER_TEMP/dist-smoke/gcc-dist/bin/g++" -O2 "$RUNNER_TEMP/dist-smoke/t.cpp" -o "$RUNNER_TEMP/dist-smoke/t"
          "$RUNNER_TEMP/dist-smoke/t"
          "$RUNNER_TEMP/dist-smoke/gcc-dist/bin/g++" --version | head -1

      # Durable publish: push the installed dist to buildhost (pazer.build,
      # the org package registry) so every branch's compiler outlives the
      # 1-day GHA artifact and stays downloadable per branch:
      #   https://dl.pazer.build/gcc?branch=<branch>&os=linux&arch=amd64
      # (serves gcc-dist.tar.zst; extract and run gcc-dist/bin/g++ directly).
      # Auth is the job's GHA OIDC token (audience = the server URL; needs the
      # workflow-level `id-token: write`); the project auto-provisions on the
      # first publish. Same REST sequence as the org's buildhost-publish
      # action: create release (recording git branch + commit) -> upload
      # artifact (kind=archive -- the payload is a tarball, not a bare
      # binary; the token rides in a curl config file so it stays off argv)
      # -> publish release.
      #
      # The upload is the ~38 MiB stripped dist from the step above, NOT the
      # ~1 GiB build-tree tarball: Cloudflare's edge 413s request bodies over
      # ~100 MiB (see that step's comment), so the published artifact must
      # stay under the cap. continue-on-error stays regardless: a registry
      # blip must never fail `build` and skip the benchmark job; the GHA
      # artifact above is the fallback.
      - name: Publish to buildhost
        continue-on-error: true
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const server = "https://pazer.build";
            const project = "gcc";
            const tarball = "gcc-dist.tar.zst";

            try {
              // getIDToken also registers the JWT as a masked secret.
              const token = await core.getIDToken(server);

              // Retry transient edge errors (5xx, or an empty-body CDN 404
              // during a buildhost rolling deploy) with backoff, like the org
              // buildhost-publish action, so a brief deploy window cannot
              // waste a ~40-minute build.
              const sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));
              const api = async (method: string, urlPath: string, body?: string) => {
                const headers: Record<string, string> = { Authorization: `Bearer ${token}` };
                if (body !== undefined) headers["Content-Type"] = "application/json";
                for (let attempt = 1; ; attempt++) {
                  try {
                    const resp = await fetch(`${server}${urlPath}`, { method, headers, body });
                    const text = await resp.text();
                    const transient = resp.status >= 500 || (resp.status === 404 && text.trim() === "");
                    if (attempt === 5 || !transient) return { status: resp.status, text };
                    core.warning(`${method} ${urlPath} -> HTTP ${resp.status} (transient, attempt ${attempt}/5)`);
                  } catch (e) {
                    if (attempt === 5) throw e;
                    core.warning(`${method} ${urlPath} -> ${e instanceof Error ? e.message : String(e)} (attempt ${attempt}/5)`);
                  }
                  await sleep(1000 * 2 ** (attempt - 1));
                }
              };

              const create = await api("POST", `/api/v1/projects/${project}/releases`,
                JSON.stringify({ git_branch: github.ref_name, git_commit: github.sha }));
              if (create.status !== 201) throw new Error(`create release failed (HTTP ${create.status}): ${create.text}`);
              const version: string = JSON.parse(create.text).version;
              core.info(`Created release ${project}/${version}`);

              const cfg = path.join(os.tmpdir(), "buildhost-auth-cfg");
              fs.writeFileSync(cfg, `header = "Authorization: Bearer ${token}"\n`, { mode: 0o600 });
              const uploadURL = `${server}/api/v1/projects/${project}/releases/${version}/artifacts/linux/amd64?kind=archive`;
              await $`curl -sS --fail-with-body --retry 4 -X PUT -K ${cfg} -H ${`X-Artifact-Filename: ${tarball}`} --data-binary ${`@${tarball}`} ${uploadURL}`;

              const pub = await api("POST", `/api/v1/projects/${project}/releases/${version}/publish`);
              if (pub.status !== 200) throw new Error(`publish failed (HTTP ${pub.status}): ${pub.text}`);
              core.info(`Published ${project}/${version} -> https://dl.pazer.build/${project}?branch=${github.ref_name}&os=linux&arch=amd64`);
            } catch (e) {
              const msg = e instanceof Error ? e.message : String(e);
              core.warning(
                `buildhost publish FAILED -- this build was NOT published to ` +
                `https://dl.pazer.build/${project}?branch=${github.ref_name}. The dist tarball is ` +
                `~38 MiB (under Cloudflare's ~100 MiB edge body cap), so this is a transient ` +
                `registry/network failure, not the old oversized-PUT 413. The gccbuild GHA ` +
                `artifact (1-day retention) is unaffected; downstream jobs continue.`);
              core.setFailed(`buildhost publish failed (non-blocking, continue-on-error): ${msg}`);
            }

  # PGO-built release package: instrumented build -> deterministic training
  # workload (contrib/perf-train) -> profile-use rebuild. Measured ~-8% cc1plus
  # wall on large template-heavy TUs with byte-identical compiler output, at
  # roughly 2x compiler-build cost -- so this job runs ONLY on pushes to the
  # release branch (develop-matt/v14) or on manual dispatch with build_pgo=true.
  # It must never gate PR verification and is not a required check; the plain
  # `build` job remains the artifact every other job consumes.
  package-pgo:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop-matt/v14') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_pgo)
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libgmp-dev libmpfr-dev libmpc-dev libisl-dev libgoogle-perftools-dev

      # Combined-tree setup: identical to the `build` job (see the comments
      # there for the why of each step).
      - name: Fetch binutils 2.42
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -fL -o binutils.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.42.tar.xz
          tar xf binutils.tar.xz
          test -d binutils-2.42/gas

      - name: Set up combined tree (symlinks)
        run: |
          cd "$GITHUB_WORKSPACE"
          BU="$GITHUB_WORKSPACE/binutils-2.42"
          for d in bfd opcodes gas libsframe libctf; do
            ln -sfn "$BU/$d" "$GITHUB_WORKSPACE/$d"
          done
          for entry in "$BU"/include/*; do
            name="$(basename "$entry")"
            case "$name" in
              ChangeLog*|MAINTAINERS|COPYING*) continue ;;
            esac
            if [ ! -e "$GITHUB_WORKSPACE/include/$name" ]; then
              ln -sfn "$entry" "$GITHUB_WORKSPACE/include/$name"
            fi
          done

      - name: Apply gas integrated-as patch
        run: |
          cd "$GITHUB_WORKSPACE"
          patch -p1 -d binutils-2.42/gas < contrib/gas-embed/gas-integrated-as.patch
          test -f binutils-2.42/gas/embed.c

      # ---------- PGO phase A: instrumented compiler ----------
      # CFLAGS_FOR_TARGET/CXXFLAGS_FOR_TARGET are pinned plain: the toplevel
      # defaults them from CFLAGS, which would leak -fprofile-generate into
      # target-library conftests (libgomp's run-test conftest then fails with
      # "cannot run C compiled programs") and pointlessly instrument target
      # libs. Only the HOST compiler is profiled; compiling target libs WITH
      # the instrumented compiler is itself free training.
      - name: Configure GCC (instrumented)
        run: |
          mkdir -p "$RUNNER_TEMP/gccbuild-gen"
          cd "$RUNNER_TEMP/gccbuild-gen"
          "$GITHUB_WORKSPACE/configure" \
            --disable-bootstrap --enable-languages=c,c++ --disable-multilib \
            --with-system-zlib --disable-nls --disable-werror \
            MAKEINFO=true \
            CFLAGS='-g -O2 -fprofile-generate' \
            CXXFLAGS='-g -O2 -fprofile-generate' \
            LDFLAGS='-fprofile-generate' \
            CFLAGS_FOR_TARGET='-g -O2' \
            CXXFLAGS_FOR_TARGET='-g -O2'

      # build-libgas.sh gets EXTRA_CFLAGS so the objects it compiles and the
      # trailing gas_embed_test harness link carry the same profile flags as
      # the archives (instrumented archives reference __gcov_*, which only
      # resolves when the harness link is instrumented too).
      # configure-target-libstdc++-v3 generates the complete libstdc++ header
      # tree (no library build) -- all the training compiles need, since they
      # are -c only.
      - name: Build instrumented compiler (all-gcc)
        run: |
          cd "$RUNNER_TEMP/gccbuild-gen"
          make -j"$(nproc)" all-libiberty MAKEINFO=true
          make -j"$(nproc)" all-bfd all-opcodes all-gas MAKEINFO=true
          export GAS_SRC="$GITHUB_WORKSPACE/gas"
          export GAS_EMBED_DIR="$GITHUB_WORKSPACE/contrib/gas-embed"
          EXTRA_CFLAGS='-fprofile-generate' \
            bash "$GAS_EMBED_DIR/build-libgas.sh" "$RUNNER_TEMP/gccbuild-gen"
          test -f "$RUNNER_TEMP/gccbuild-gen/libgas.a"
          make -j"$(nproc)" all-gcc MAKEINFO=true
          make configure-target-libstdc++-v3 MAKEINFO=true
          test -f "$RUNNER_TEMP/gccbuild-gen/x86_64-pc-linux-gnu/libstdc++-v3/include/vector"

      # ---------- PGO phase A2: training run ----------
      # Deterministic committed workload (contrib/perf-train, see its README).
      # The instrumented cc1/cc1plus write .gcda next to the objects in
      # gccbuild-gen automatically (absolute paths are baked in at compile
      # time). The build itself already contributed gen-tool/selftest profiles.
      - name: Train (contrib/perf-train)
        run: |
          GEN="$RUNNER_TEMP/gccbuild-gen"
          T=x86_64-pc-linux-gnu
          XGXX="$GEN/gcc/xg++ -B$GEN/gcc -nostdinc++ -I$GEN/$T/libstdc++-v3/include/$T -I$GEN/$T/libstdc++-v3/include -I$GITHUB_WORKSPACE/libstdc++-v3/libsupc++"
          XGCC="$GEN/gcc/xgcc -B$GEN/gcc"
          PT="$GITHUB_WORKSPACE/contrib/perf-train"
          $XGXX -O0 -c "$PT/train-stl.cpp"       -o "$RUNNER_TEMP/t.o"
          $XGXX -O2 -c "$PT/train-stl.cpp"       -o "$RUNNER_TEMP/t.o"
          $XGXX -O2 -c "$PT/train-templates.cpp" -o "$RUNNER_TEMP/t.o"
          $XGCC -O0 -c "$PT/train-c.c"           -o "$RUNNER_TEMP/t.o"
          $XGCC -O2 -c "$PT/train-c.c"           -o "$RUNNER_TEMP/t.o"
          echo "gcda files: $(find "$GEN" -name '*.gcda' | wc -l)"

      # ---------- PGO phase B: optimized compiler ----------
      - name: Configure GCC (profile-use)
        run: |
          mkdir -p "$RUNNER_TEMP/gccbuild-pgo"
          cd "$RUNNER_TEMP/gccbuild-pgo"
          "$GITHUB_WORKSPACE/configure" \
            --disable-bootstrap --enable-languages=c,c++ --disable-multilib \
            --with-system-zlib --disable-nls --disable-werror \
            MAKEINFO=true \
            CFLAGS='-g -O2 -fprofile-use -fprofile-correction' \
            CXXFLAGS='-g -O2 -fprofile-use -fprofile-correction' \
            CFLAGS_FOR_TARGET='-g -O2' \
            CXXFLAGS_FOR_TARGET='-g -O2'
          # Mirror the profile data so each object's .gcda sits where the new
          # objects will be written (that is where -fprofile-use looks).
          (cd "$RUNNER_TEMP/gccbuild-gen" && find . -name '*.gcda' -print0 | tar cf - --null -T -) \
            | tar xf - -C "$RUNNER_TEMP/gccbuild-pgo"

      - name: Build GCC (PGO-optimized)
        run: |
          cd "$RUNNER_TEMP/gccbuild-pgo"
          make -j"$(nproc)" all-libiberty MAKEINFO=true
          make -j"$(nproc)" all-bfd all-opcodes all-gas MAKEINFO=true
          export GAS_SRC="$GITHUB_WORKSPACE/gas"
          export GAS_EMBED_DIR="$GITHUB_WORKSPACE/contrib/gas-embed"
          EXTRA_CFLAGS='-fprofile-use -fprofile-correction' \
            bash "$GAS_EMBED_DIR/build-libgas.sh" "$RUNNER_TEMP/gccbuild-pgo"
          test -f "$RUNNER_TEMP/gccbuild-pgo/libgas.a"
          make -j"$(nproc)" all-gcc MAKEINFO=true
          rm -rf "$RUNNER_TEMP/gccbuild-gen"   # reclaim runner disk
          make -j"$(nproc)" all-target-libstdc++-v3 MAKEINFO=true

      # Same packaging shape as the `build` job so downstream consumers can
      # treat the two artifacts interchangeably.
      - name: Package PGO compiler
        run: |
          mv "$RUNNER_TEMP/gccbuild-pgo" "$RUNNER_TEMP/gccbuild"
          tar -C "$RUNNER_TEMP" -czf gccbuild-pgo.tar.gz gccbuild
          ls -lh gccbuild-pgo.tar.gz

      - name: Upload PGO compiler
        uses: actions/upload-artifact@v4
        with:
          name: gccbuild-pgo
          path: gccbuild-pgo.tar.gz
          retention-days: 7

      # Same installed-dist packaging as the `build` job (see the comments
      # there): the buildhost artifact must stay under Cloudflare's ~100 MiB
      # edge body cap, so the ~1 GiB build tree is not publishable and this
      # stripped ~38 MiB dist is. The tree was mv'd to $RUNNER_TEMP/gccbuild
      # by "Package PGO compiler" above, so the same commands apply.
      - name: Package installed dist (fits buildhost upload cap)
        run: |
          WORK="$RUNNER_TEMP/dist"
          rm -rf "$WORK"
          make -C "$RUNNER_TEMP/gccbuild" -j2 install-gcc install-target-libgcc install-target-libstdc++-v3 \
            DESTDIR="$WORK" MAKEINFO=true
          # configured --prefix is /usr/local; rename the installed prefix
          mv "$WORK/usr/local" "$WORK/gcc-dist"
          cd "$WORK/gcc-dist"
          # trim what a consumer never needs (keep c++ headers, libgcc, crt, specs)
          rm -rf share/man share/info share/doc
          rm -rf libexec/gcc/x86_64-pc-linux-gnu/*/install-tools lib/gcc/x86_64-pc-linux-gnu/*/install-tools
          find . -name '*.la' -delete
          # strip(1) replaces inodes, which would break the driver hardlink
          # groups (gcc/g++/c++/x86_64-pc-linux-gnu-* share inodes): record
          # the groups, strip one path per inode, then restore the links.
          find . -type f -links +1 -printf '%i %p\n' | sort -n > "$WORK/hardlinks.txt"
          find . -type f -exec file {} + | grep -E 'ELF.*(executable|shared object)' | cut -d: -f1 > "$WORK/elf.txt"
          while read -r f; do printf '%s %s\n' "$(stat -c %i "$f")" "$f"; done < "$WORK/elf.txt" \
            | awk '!seen[$1]++ { $1=""; sub(/^ /,""); print }' > "$WORK/striplist.txt"
          xargs -a "$WORK/striplist.txt" strip --strip-unneeded
          awk '{ if ($1 in first) print first[$1] "\t" $2; else first[$1]=$2 }' "$WORK/hardlinks.txt" \
            | while IFS=$'\t' read -r src dst; do ln -f "$src" "$dst"; done
          # static libs / crt objects: --strip-debug only (--strip-unneeded would gut them)
          find . -type f \( -name '*.a' -o -name 'crt*.o' \) -exec strip --strip-debug {} +
          du -sh "$WORK/gcc-dist"
          tar -C "$WORK" -cf - gcc-dist | zstd -19 --long=27 -T0 -o "$GITHUB_WORKSPACE/gcc-dist-pgo.tar.zst"
          ls -l "$GITHUB_WORKSPACE/gcc-dist-pgo.tar.zst"
          # smoke test the packed dist from a fresh path before publishing it
          mkdir -p "$RUNNER_TEMP/dist-smoke"
          tar -C "$RUNNER_TEMP/dist-smoke" --zstd -xf "$GITHUB_WORKSPACE/gcc-dist-pgo.tar.zst"
          cat > "$RUNNER_TEMP/dist-smoke/t.cpp" <<'EOF'
          #include <vector>
          #include <iostream>
          int main() { std::vector<int> v{1,2,3}; int s=0; for (int x : v) s+=x; std::cout << s << "\n"; }
          EOF
          "$RUNNER_TEMP/dist-smoke/gcc-dist/bin/g++" -O2 "$RUNNER_TEMP/dist-smoke/t.cpp" -o "$RUNNER_TEMP/dist-smoke/t"
          "$RUNNER_TEMP/dist-smoke/t"
          "$RUNNER_TEMP/dist-smoke/gcc-dist/bin/g++" --version | head -1

      # Durable publish, same as the `build` job (see the comments there) --
      # but to project gcc/pgo: the repo's OIDC grant covers its own
      # namespace only ("gcc" and "gcc/<...>"), so the PGO package nests
      # under gcc rather than a sibling "gcc-pgo" the token could not create.
      #   https://dl.pazer.build/gcc/pgo?branch=develop-matt/v14&os=linux&arch=amd64
      # Uploads the ~38 MiB dist from the step above (under Cloudflare's
      # ~100 MiB edge body cap). continue-on-error stays: a registry blip
      # must not fail package-pgo; the gccbuild-pgo GHA artifact remains.
      - name: Publish PGO build to buildhost
        continue-on-error: true
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const server = "https://pazer.build";
            const project = "gcc/pgo";
            const tarball = "gcc-dist-pgo.tar.zst";

            try {
              const token = await core.getIDToken(server);

              const sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));
              const api = async (method: string, urlPath: string, body?: string) => {
                const headers: Record<string, string> = { Authorization: `Bearer ${token}` };
                if (body !== undefined) headers["Content-Type"] = "application/json";
                for (let attempt = 1; ; attempt++) {
                  try {
                    const resp = await fetch(`${server}${urlPath}`, { method, headers, body });
                    const text = await resp.text();
                    const transient = resp.status >= 500 || (resp.status === 404 && text.trim() === "");
                    if (attempt === 5 || !transient) return { status: resp.status, text };
                    core.warning(`${method} ${urlPath} -> HTTP ${resp.status} (transient, attempt ${attempt}/5)`);
                  } catch (e) {
                    if (attempt === 5) throw e;
                    core.warning(`${method} ${urlPath} -> ${e instanceof Error ? e.message : String(e)} (attempt ${attempt}/5)`);
                  }
                  await sleep(1000 * 2 ** (attempt - 1));
                }
              };

              const create = await api("POST", `/api/v1/projects/${project}/releases`,
                JSON.stringify({ git_branch: github.ref_name, git_commit: github.sha }));
              if (create.status !== 201) throw new Error(`create release failed (HTTP ${create.status}): ${create.text}`);
              const version: string = JSON.parse(create.text).version;
              core.info(`Created release ${project}/${version}`);

              const cfg = path.join(os.tmpdir(), "buildhost-auth-cfg");
              fs.writeFileSync(cfg, `header = "Authorization: Bearer ${token}"\n`, { mode: 0o600 });
              const uploadURL = `${server}/api/v1/projects/${project}/releases/${version}/artifacts/linux/amd64?kind=archive`;
              await $`curl -sS --fail-with-body --retry 4 -X PUT -K ${cfg} -H ${`X-Artifact-Filename: ${tarball}`} --data-binary ${`@${tarball}`} ${uploadURL}`;

              const pub = await api("POST", `/api/v1/projects/${project}/releases/${version}/publish`);
              if (pub.status !== 200) throw new Error(`publish failed (HTTP ${pub.status}): ${pub.text}`);
              core.info(`Published ${project}/${version} -> https://dl.pazer.build/${project}?branch=${github.ref_name}&os=linux&arch=amd64`);
            } catch (e) {
              const msg = e instanceof Error ? e.message : String(e);
              core.warning(
                `buildhost publish FAILED -- this PGO build was NOT published to ` +
                `https://dl.pazer.build/${project}?branch=${github.ref_name}. The dist tarball is ` +
                `~38 MiB (under Cloudflare's ~100 MiB edge body cap), so this is a transient ` +
                `registry/network failure, not the old oversized-PUT 413. The gccbuild-pgo GHA ` +
                `artifact (7-day retention) is unaffected.`);
              core.setFailed(`buildhost publish failed (non-blocking, continue-on-error): ${msg}`);
            }

  benchmark:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Download built compiler
        uses: actions/download-artifact@v4
        with:
          name: gccbuild

      - name: Restore built compiler
        run: |
          tar -C "$RUNNER_TEMP" -xzf gccbuild.tar.gz
          test -x "$RUNNER_TEMP/gccbuild/gcc/xg++"

      # Runtime libs in case the restored compiler needs them at link/compile
      # time, plus ccache (used as a comparison baseline in the benchmark).
      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libgmp-dev libmpfr-dev libmpc-dev libisl-dev

      # When dispatched with reset_cache=true, delete the persisted cache entry
      # (so the restore below finds nothing) and remove any local copy, giving
      # a forced cold run. gh needs GH_TOKEN; actions:write permits cache
      # deletion. Best-effort: a missing entry is not an error.
      - name: Reset compile cache (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_cache }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "reset_cache requested: clearing persisted compile cache"
          rm -rf "$GCC_CC_DIR" || true
          PREFIX="gcc-cc-${{ runner.os }}-${{ github.ref_name }}-"
          gh cache list --ref "${{ github.ref }}" --limit 100 --json id,key \
            --jq ".[] | select(.key | startswith(\"$PREFIX\")) | .id" \
            | while read -r id; do
                echo "deleting cache entry id=$id"
                gh cache delete "$id" || true
              done

      - name: Restore compile cache
        # Skip the restore entirely on a forced reset so we start truly cold.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.reset_cache) }}
        uses: actions/cache@v4
        with:
          path: ${{ env.GCC_CC_DIR }}
          key: gcc-cc-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            gcc-cc-${{ runner.os }}-${{ github.ref_name }}-
            gcc-cc-${{ runner.os }}-

      # On a forced reset we skipped actions/cache (which also schedules the
      # post-run save), so register the cache here to persist this cold run's
      # freshly populated dir for next time.
      - name: Save compile cache (after forced reset)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_cache }}
        uses: actions/cache@v4
        with:
          path: ${{ env.GCC_CC_DIR }}
          key: gcc-cc-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}

      # 5-way benchmark (no-cache / ours-cold / ours-warm / ccache-cold /
      # ccache-warm) on a small fixed workload. Writes a Markdown table to the
      # run UI ($GITHUB_STEP_SUMMARY) and the log.
      - name: Benchmark in-compiler cache
        run: node "$GITHUB_WORKSPACE/.github/scripts/ci-bench-cache.mjs" "$RUNNER_TEMP/gccbuild"

      # Exercise the persisted cache so the post-run actions/cache save captures
      # populated entries that a later run on this ref can reuse.
      - name: Warm persisted compile cache
        run: |
          mkdir -p "$GCC_CC_DIR"
          BUILD="$RUNNER_TEMP/gccbuild"
          XGCC="$BUILD/gcc/xgcc -B$BUILD/gcc"
          printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/warm.c"
          GCC_COMPILE_CACHE_DEBUG=1 $XGCC -O2 -fcompile-cache="$GCC_CC_DIR" \
            -c "$RUNNER_TEMP/warm.c" -o "$RUNNER_TEMP/warm.o"
          echo "persisted cache now holds $(find "$GCC_CC_DIR" -name '*.o' | wc -l) object(s)"

  # GCC-testsuite regression gate: run the fork's C/C++/libstdc++ testsuites
  # against the freshly built compiler and fail on any new FAIL or XPASS
  # relative to the published vanilla fork-point baseline (see the
  # testsuite-baseline job below and .github/TESTSUITE.md).
  #
  # Deliberately NOT on every push -- this deviates from the org's plain
  # `on: push` preference because the full testsuite is a multi-hour job:
  # it runs on pushes to the release branch (develop-matt/v14, like
  # package-pgo) and on manual dispatch with run_testsuite=true.
  testsuite:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop-matt/v14') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_testsuite)
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: gcc            # C testsuite            -> gcc.sum
          - shard: gxx-libstdcxx  # C++ + libstdc++ suites -> g++.sum, libstdc++.sum
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      # dejagnu drives the testsuite; the gmp/mpfr/mpc/isl runtime libs are
      # what the restored cc1/cc1plus link against (same set the benchmark
      # job installs).
      - name: Install testsuite dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dejagnu libgmp-dev libmpfr-dev libmpc-dev libisl-dev

      # Fetch the published baseline FIRST: if none exists yet the job fails
      # in seconds with the fix, instead of after a 3h testsuite run.
      # Anonymous download -- dl.pazer.build serves this org's projects
      # publicly (verified against the gcc dist); latest version, no branch
      # filter (the baseline is a property of the fork point, not a branch).
      - name: Download testsuite baseline
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const url = "https://dl.pazer.build/gcc/testsuite-baseline?os=linux&arch=amd64";
            const dest = path.join(process.env.RUNNER_TEMP!, "testsuite-baseline.tar.gz");
            const sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));
            for (let attempt = 1; ; attempt++) {
              try {
                const resp = await fetch(url);
                if (resp.status === 404) {
                  core.setFailed(
                    `no testsuite baseline published yet (HTTP 404 from ${url}) -- ` +
                    `dispatch this workflow once with build_baseline=true to generate it ` +
                    `(see .github/TESTSUITE.md), then re-run.`);
                  return;
                }
                if (resp.status !== 200) throw new Error(`HTTP ${resp.status}`);
                const buf = Buffer.from(await resp.arrayBuffer());
                fs.writeFileSync(dest, buf);
                core.info(`downloaded ${buf.length} bytes -> ${dest}`);
                return;
              } catch (e) {
                if (attempt === 5) throw e;
                core.warning(`baseline download: ${e instanceof Error ? e.message : String(e)} (attempt ${attempt}/5)`);
                await sleep(1000 * 2 ** (attempt - 1));
              }
            }

      - name: Unpack testsuite baseline
        run: |
          mkdir -p "$RUNNER_TEMP/baseline-sums"
          tar -xzf "$RUNNER_TEMP/testsuite-baseline.tar.gz" -C "$RUNNER_TEMP/baseline-sums"
          cat "$RUNNER_TEMP/baseline-sums/BASELINE-INFO.txt" || true
          ls -l "$RUNNER_TEMP/baseline-sums"

      - name: Download built compiler
        uses: actions/download-artifact@v4
        with:
          name: gccbuild

      # Same path reconstitution as the benchmark job: the tarball unpacks to
      # $RUNNER_TEMP/gccbuild with all configure-recorded paths (srcdir =
      # $GITHUB_WORKSPACE, i.e. /home/runner/work/gcc/gcc) intact, and the
      # fresh checkout above provides that srcdir, including gcc/testsuite.
      - name: Restore built compiler
        run: |
          tar -C "$RUNNER_TEMP" -xzf gccbuild.tar.gz
          test -x "$RUNNER_TEMP/gccbuild/gcc/xg++"

      # The artifact's mtimes predate the fresh checkout, so `make check`
      # would consider every generated file stale and try to rebuild the
      # compiler. Stamp every build-tree file with ONE identical timestamp,
      # newer than the checkout: GNU make treats an equal-mtime prerequisite
      # as up to date, so nothing inside the tree rebuilds either. -h keeps
      # the build tree's symlinks (which point back into the checkout) from
      # retouching source files.
      - name: Freshen build-tree timestamps
        run: |
          TS="$(date +%Y%m%d%H%M.%S)"
          find "$RUNNER_TEMP/gccbuild" -print0 | xargs -0 touch -h -t "$TS"
          echo "stamped $(find "$RUNNER_TEMP/gccbuild" | wc -l) paths with $TS"

      # Dejagnu FAILs do not fail `make check`; a nonzero exit means a
      # testsuite chunk crashed -- tolerate it, the gate runs on the .sum
      # diff and the collect step verifies the .sums are complete. Per-tool
      # targets run inside gcc/ because the TOPLEVEL check-gcc target is
      # `cd gcc && make check`, i.e. every language at once.
      - name: Run C testsuite (check-gcc)
        if: matrix.shard == 'gcc'
        run: |
          make -C "$RUNNER_TEMP/gccbuild/gcc" -j"$(nproc)" -k check-gcc \
            || echo "::warning::check-gcc make exit $? (tolerated; gating is on the .sum diff)"

      - name: Run C++ + libstdc++ testsuites (check-g++, libstdc++ check)
        if: matrix.shard == 'gxx-libstdcxx'
        run: |
          make -C "$RUNNER_TEMP/gccbuild/gcc" -j"$(nproc)" -k check-g++ \
            || echo "::warning::check-g++ make exit $? (tolerated; gating is on the .sum diff)"
          make -C "$RUNNER_TEMP/gccbuild/x86_64-pc-linux-gnu/libstdc++-v3" -j"$(nproc)" -k check \
            || echo "::warning::libstdc++ check make exit $? (tolerated; gating is on the .sum diff)"

      - name: Collect .sum files
        run: |
          B="$RUNNER_TEMP/gccbuild"
          OUT="$RUNNER_TEMP/sums"
          mkdir -p "$OUT"
          case "${{ matrix.shard }}" in
            gcc)
              cp "$B/gcc/testsuite/gcc/gcc.sum" "$OUT/" ;;
            gxx-libstdcxx)
              cp "$B/gcc/testsuite/g++/g++.sum" "$OUT/"
              cp "$B/x86_64-pc-linux-gnu/libstdc++-v3/testsuite/libstdc++.sum" "$OUT/" ;;
          esac
          for f in "$OUT"/*.sum; do
            grep -q "Summary ===" "$f" || { echo "::error::$f has no summary block (testsuite crashed?)"; exit 1; }
            echo "== $f =="
            grep -E "^# of " "$f" || true
          done

      # The gate: fail on any new FAIL/XPASS vs the baseline unless waived in
      # .github/testsuite-known-diffs.txt. Also runs contrib/compare_tests
      # per .sum pair for the classic report (embedded in the step summary
      # and the uploaded report file).
      - name: Diff against baseline (gate)
        run: |
          node "$GITHUB_WORKSPACE/.github/scripts/testsuite-diff.mjs" \
            --baseline "$RUNNER_TEMP/baseline-sums" \
            --current "$RUNNER_TEMP/sums" \
            --waivers "$GITHUB_WORKSPACE/.github/testsuite-known-diffs.txt" \
            --compare-tests "$GITHUB_WORKSPACE/contrib/compare_tests" \
            --report "$RUNNER_TEMP/sums/testsuite-diff-report.md"

      # Always keep the fork's .sums + the diff report, pass or fail --
      # they are the evidence for triaging and for waiver entries.
      - name: Upload fork .sum files + diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testsuite-sums-${{ matrix.shard }}
          path: ${{ runner.temp }}/sums/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # GCC-testsuite regression gate -- overview in .github/TESTSUITE.md.
  #
  # testsuite-baseline (+ testsuite-baseline-publish) is dispatch-only: it
  # builds PRISTINE upstream GCC at the fork point and publishes its dejagnu
  # .sum files to buildhost, where the `testsuite` gate job downloads them and
  # fails on any new FAIL/XPASS the fork introduces. Regenerate (dispatch with
  # build_baseline=true) after rebasing the fork onto a new upstream commit,
  # or when the runner image shifts enough to move environment-dependent
  # tests (glibc/binutils skew shows up as paired baseline+fork diffs, so a
  # stale baseline surfaces as noise in the gate report).
  # ---------------------------------------------------------------------------
  testsuite-baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.build_baseline
    # The vanilla build is ~40 min and check-gcc alone is ~3h at -j4, so the
    # three suites are split across two shards to stay well inside the 6h
    # hosted-runner job cap (this file otherwise relies on the 360-min
    # default; these long jobs pin an explicit generous limit).
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: gcc            # C testsuite            -> gcc.sum
          - shard: gxx-libstdcxx  # C++ + libstdc++ suites -> g++.sum, libstdc++.sum
    steps:
      # The fork point: commit 820ff02b9 "Bump BASE-VER." (upstream
      # releases/gcc-14, BASE-VER 14.4.1) -- the last commit before any fork
      # patch. NO fork changes, NO binutils overlay, NO libgas. Checked out
      # into a subdirectory so nothing from the fork workspace leaks in.
      - uses: actions/checkout@v4
        with:
          ref: 820ff02b98af9dda4eb8094322347ab458de351e
          path: gcc-base

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install build + testsuite dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libgmp-dev libmpfr-dev libmpc-dev libisl-dev dejagnu

      # Same configure flags as the fork's `build` job MINUS everything the
      # fork adds (combined tree, libgas). None of the extra flags affects
      # codegen or test results, but keeping the two configurations identical
      # means the only .sum delta left is the fork's patches.
      # --disable-multilib is also load-bearing on its own: the runner has no
      # 32-bit glibc, so a multilib build of the target libs cannot succeed.
      - name: Configure vanilla GCC (fork point, out of tree)
        run: |
          mkdir -p "$RUNNER_TEMP/base-build"
          cd "$RUNNER_TEMP/base-build"
          "$GITHUB_WORKSPACE/gcc-base/configure" \
            --disable-bootstrap --enable-languages=c,c++ --disable-multilib \
            --with-system-zlib --disable-nls --disable-werror \
            MAKEINFO=true

      # Same targets as the fork build: all-gcc + all-target-libstdc++-v3
      # (which pulls in libgcc). Deliberately NOT `make all`: the fork
      # artifact has no libgomp/libsanitizer/libatomic either, so tests
      # needing those runtimes come out UNSUPPORTED on BOTH sides instead of
      # polluting the diff.
      - name: Build vanilla GCC
        run: |
          cd "$RUNNER_TEMP/base-build"
          make -j"$(nproc)" all-gcc MAKEINFO=true
          make -j"$(nproc)" all-target-libstdc++-v3 MAKEINFO=true

      # Dejagnu FAILs do not fail `make check` (a baseline is EXPECTED to
      # carry some); a nonzero exit here means a testsuite chunk crashed --
      # tolerate it and let the .sum sanity check below decide. Sharded
      # per-tool targets run inside the gcc/ build dir because the TOPLEVEL
      # check-gcc target is `cd gcc && make check`, i.e. every language at
      # once.
      - name: Run C testsuite (check-gcc)
        if: matrix.shard == 'gcc'
        run: |
          make -C "$RUNNER_TEMP/base-build/gcc" -j"$(nproc)" -k check-gcc \
            || echo "::warning::check-gcc make exit $? (tolerated; gating is on the .sum diff)"

      - name: Run C++ + libstdc++ testsuites (check-g++, libstdc++ check)
        if: matrix.shard == 'gxx-libstdcxx'
        run: |
          make -C "$RUNNER_TEMP/base-build/gcc" -j"$(nproc)" -k check-g++ \
            || echo "::warning::check-g++ make exit $? (tolerated; gating is on the .sum diff)"
          make -C "$RUNNER_TEMP/base-build/x86_64-pc-linux-gnu/libstdc++-v3" -j"$(nproc)" -k check \
            || echo "::warning::libstdc++ check make exit $? (tolerated; gating is on the .sum diff)"

      - name: Collect .sum files
        run: |
          B="$RUNNER_TEMP/base-build"
          OUT="$RUNNER_TEMP/sums"
          mkdir -p "$OUT"
          case "${{ matrix.shard }}" in
            gcc)
              cp "$B/gcc/testsuite/gcc/gcc.sum" "$OUT/" ;;
            gxx-libstdcxx)
              cp "$B/gcc/testsuite/g++/g++.sum" "$OUT/"
              cp "$B/x86_64-pc-linux-gnu/libstdc++-v3/testsuite/libstdc++.sum" "$OUT/" ;;
          esac
          # Sanity: every collected .sum must have run through to its summary
          # block (a crashed runtest leaves a truncated file).
          for f in "$OUT"/*.sum; do
            grep -q "Summary ===" "$f" || { echo "::error::$f has no summary block (testsuite crashed?)"; exit 1; }
            echo "== $f =="
            grep -E "^# of " "$f" || true
          done

      - name: Upload baseline .sum files (shard)
        uses: actions/upload-artifact@v4
        with:
          name: testsuite-baseline-sums-${{ matrix.shard }}
          path: ${{ runner.temp }}/sums/
          retention-days: 7

  # Fan-in: gather both shards' .sums, tar them, and publish ONE canonical
  # baseline archive to buildhost project gcc/testsuite-baseline (nested
  # under gcc/ because the repo's OIDC grant covers its own namespace only,
  # exactly like gcc/pgo). The `testsuite` gate downloads the LATEST
  # published version with no branch filter -- the baseline is a property of
  # the fork point, not of any branch -- via anonymous GET (dl.pazer.build
  # serves this org's projects publicly; verified with an unauthenticated
  # probe against the gcc dist).
  testsuite-baseline-publish:
    needs: testsuite-baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.build_baseline
    steps:
      - name: Download shard .sum files
        uses: actions/download-artifact@v4
        with:
          pattern: testsuite-baseline-sums-*
          merge-multiple: true
          path: baseline-sums

      - name: Assemble baseline tarball
        run: |
          cd baseline-sums
          for f in gcc.sum g++.sum libstdc++.sum; do
            test -s "$f" || { echo "::error::missing $f in shard artifacts"; exit 1; }
          done
          {
            echo "Vanilla GCC testsuite baseline (see .github/TESTSUITE.md)"
            echo "fork-point-commit: 820ff02b98af9dda4eb8094322347ab458de351e (Bump BASE-VER., releases/gcc-14, 14.4.1)"
            echo "generated-by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "generated-on: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner-image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          } > BASELINE-INFO.txt
          cat BASELINE-INFO.txt
          tar -czf "$GITHUB_WORKSPACE/testsuite-baseline.tar.gz" gcc.sum g++.sum libstdc++.sum BASELINE-INFO.txt
          ls -l "$GITHUB_WORKSPACE/testsuite-baseline.tar.gz"

      - name: Upload baseline tarball (GHA artifact copy)
        uses: actions/upload-artifact@v4
        with:
          name: testsuite-baseline
          path: testsuite-baseline.tar.gz

      # Same REST sequence + transient-retry policy as the dist publish in
      # `build` (see the comments there), with two deliberate differences:
      # NO continue-on-error (publishing IS this job's purpose -- the
      # `testsuite` gate cannot run without it), and git_commit records the
      # FORK POINT the .sums describe rather than the workflow's own sha
      # (which is preserved inside BASELINE-INFO.txt instead).
      - name: Publish baseline to buildhost
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const server = "https://pazer.build";
            const project = "gcc/testsuite-baseline";
            const tarball = "testsuite-baseline.tar.gz";
            const forkPoint = "820ff02b98af9dda4eb8094322347ab458de351e";

            try {
              // getIDToken also registers the JWT as a masked secret.
              const token = await core.getIDToken(server);

              const sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));
              const api = async (method: string, urlPath: string, body?: string) => {
                const headers: Record<string, string> = { Authorization: `Bearer ${token}` };
                if (body !== undefined) headers["Content-Type"] = "application/json";
                for (let attempt = 1; ; attempt++) {
                  try {
                    const resp = await fetch(`${server}${urlPath}`, { method, headers, body });
                    const text = await resp.text();
                    const transient = resp.status >= 500 || (resp.status === 404 && text.trim() === "");
                    if (attempt === 5 || !transient) return { status: resp.status, text };
                    core.warning(`${method} ${urlPath} -> HTTP ${resp.status} (transient, attempt ${attempt}/5)`);
                  } catch (e) {
                    if (attempt === 5) throw e;
                    core.warning(`${method} ${urlPath} -> ${e instanceof Error ? e.message : String(e)} (attempt ${attempt}/5)`);
                  }
                  await sleep(1000 * 2 ** (attempt - 1));
                }
              };

              const create = await api("POST", `/api/v1/projects/${project}/releases`,
                JSON.stringify({ git_branch: github.ref_name, git_commit: forkPoint }));
              if (create.status !== 201) throw new Error(`create release failed (HTTP ${create.status}): ${create.text}`);
              const version: string = JSON.parse(create.text).version;
              core.info(`Created release ${project}/${version}`);

              const cfg = path.join(os.tmpdir(), "buildhost-auth-cfg");
              fs.writeFileSync(cfg, `header = "Authorization: Bearer ${token}"\n`, { mode: 0o600 });
              const uploadURL = `${server}/api/v1/projects/${project}/releases/${version}/artifacts/linux/amd64?kind=archive`;
              await $`curl -sS --fail-with-body --retry 4 -X PUT -K ${cfg} -H ${`X-Artifact-Filename: ${tarball}`} --data-binary ${`@${tarball}`} ${uploadURL}`;

              const pub = await api("POST", `/api/v1/projects/${project}/releases/${version}/publish`);
              if (pub.status !== 200) throw new Error(`publish failed (HTTP ${pub.status}): ${pub.text}`);
              core.info(`Published ${project}/${version} -> https://dl.pazer.build/${project}?os=linux&arch=amd64`);
            } catch (e) {
              core.setFailed(`baseline publish failed: ${e instanceof Error ? e.message : String(e)}`);
            }
