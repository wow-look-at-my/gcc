name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libgmp-dev libmpfr-dev libmpc-dev libisl-dev

      - name: Configure GCC (out of tree)
        run: |
          mkdir -p "$RUNNER_TEMP/gccbuild"
          cd "$RUNNER_TEMP/gccbuild"
          "$GITHUB_WORKSPACE/configure" --disable-bootstrap --enable-languages=c,c++ --disable-multilib

      - name: Build GCC
        run: |
          cd "$RUNNER_TEMP/gccbuild"
          make -j"$(nproc)"

      - name: Verify in-compiler cache
        run: node "$GITHUB_WORKSPACE/.github/scripts/ci-verify-cache.mjs" "$RUNNER_TEMP/gccbuild"
